<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>登录 · Muxi Account</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/identity.css">
</head>
<body class="identity-body">
  <main class="identity-stage">
    <section class="identity-card" aria-labelledby="page-title">
      <a class="identity-brand" href="/" aria-label="Muxi Account">
        <span class="identity-mark" aria-hidden="true">M</span>
        <span>Muxi</span>
      </a>

      <p class="identity-context" id="auth-context" hidden></p>
      <h1 id="page-title">登录</h1>
      <p class="identity-subtitle">使用你的 Muxi Account 继续。</p>

      <div id="message" class="identity-message" hidden></div>

      <form id="login-form" class="identity-form">
        <label class="identity-field">
          <span>邮箱、用户名或 UID</span>
          <input name="identity" autocomplete="username" autofocus required>
        </label>
        <label class="identity-field">
          <span>密码</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="identity-inline-help">
          还没有账户？<a href="/register" data-preserve-continue>创建一个</a>
        </div>
        <div class="identity-actions">
          <button type="submit" class="identity-primary">登录</button>
        </div>
      </form>

      <div class="identity-divider"><span>或</span></div>
      <div class="identity-social">
        <a class="identity-social-button" data-provider="qq" href="#" aria-disabled="true">使用 QQ 登录</a>
        <a class="identity-social-button" data-provider="wechat" href="#" aria-disabled="true">使用微信登录</a>
      </div>
    </section>
  </main>

  <footer class="identity-footer">
    <span>Muxi Account</span>
    <span>OAuth 2.0 · OpenID Connect</span>
  </footer>
  <script src="/static/app.js" defer></script>
</body>
</html>
