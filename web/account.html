<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>账户 · muxi 账户</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">muxi <span>// 账户</span></a>
  </header>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">YOUR IDENTITY</div>
      <h1 id="nickname">—</h1>
      <p><span id="username">—</span> · UID <span id="uid">—</span></p>
    </section>
    <section class="card">
      <h2>账户资料</h2>
      <p>UID 和 Minecraft 游戏名保持稳定；昵称和平台用户名可以修改。</p>
      <div id="message" class="message" hidden></div>
      <form id="profile-form" class="form">
        <label class="field"><span>昵称</span><input id="profile-nickname" name="nickname" maxlength="64" required></label>
        <label class="field"><span>用户名</span><input id="profile-username" name="username" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]+" required></label>
        <button type="submit">保存修改</button>
      </form>
      <div class="profile">
        <div><span>UID</span><span id="profile-uid">—</span></div>
        <div><span>Minecraft 游戏名</span><span id="game-name">—</span></div>
        <div><span>邮箱</span><span id="email">未绑定</span></div>
        <div><span>角色</span><span id="role">—</span></div>
        <div><span>创建时间</span><span id="created">—</span></div>
      </div>
      <button id="logout" class="secondary">退出登录</button>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
