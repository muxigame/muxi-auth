<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>找回密码 · muxi 账户</title>
  <link rel="stylesheet" href="/static/theme.css?v=theme-20261115">
  <link rel="stylesheet" href="/static/style.css?v=theme-20261115">
  <link rel="stylesheet" href="/static/identity.css?v=identity-20261116">
</head>
<body class="identity-body">
  <main class="identity-stage">
    <section class="identity-card" aria-labelledby="page-title">
      <a class="identity-brand" href="/" aria-label="muxi 账户">
        <span class="identity-mark" aria-hidden="true">M</span>
        <span>muxi</span>
      </a>

      <p class="identity-context" id="auth-context" hidden></p>
      <h1 id="page-title">找回密码</h1>
      <p class="identity-subtitle">填写账户已验证的邮箱，通过邮件设置新密码。</p>
      <div id="message" class="identity-message" role="status" aria-live="polite" hidden></div>

      <form id="forgot-password-form" class="identity-form" method="post" action="/api/account/password-reset/request">
        <label class="identity-field">
          <span>邮箱</span>
          <input name="email" type="email" maxlength="254" autocomplete="email" autofocus required>
          <small>如果邮箱关联可找回的账户，我们会发送邮件。请检查收件箱和垃圾邮件。</small>
        </label>
        <div class="identity-actions">
          <button type="submit" class="identity-primary">申请找回密码</button>
        </div>
      </form>
      <div class="identity-inline-help">
        想起密码了？<a href="/login" data-preserve-continue>返回登录</a>
      </div>
      <noscript><p class="identity-subtitle">请启用 JavaScript 后提交申请。</p></noscript>
    </section>
  </main>
  <footer class="identity-footer"><span>muxi 账户</span><span>统一身份服务</span></footer>
  <script src="/static/app.js?v=identity-20261116" defer></script>
</body>
</html>
