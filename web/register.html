<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>创建账户 · muxi 账户</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/identity.css">
</head>
<body class="identity-body">
  <main class="identity-stage">
    <section class="identity-card" aria-labelledby="page-title">
      <a class="identity-brand" href="/" aria-label="muxi 账户">
        <span class="identity-mark" aria-hidden="true">M</span>
        <span>muxi</span>
      </a>

      <p class="identity-context" id="auth-context" hidden></p>
      <h1 id="page-title">创建账户</h1>
      <p class="identity-subtitle">这个账户将用于 muxigame 的网站与客户端。</p>

      <div id="message" class="identity-message" hidden></div>

      <form id="register-form" class="identity-form">
        <label class="identity-field">
          <span>昵称</span>
          <input name="nickname" maxlength="64" autocomplete="nickname" autofocus required>
          <small>用于平台展示，可以和其他人重复，也可以以后修改。</small>
        </label>
        <label class="identity-field">
          <span>用户名</span>
          <input name="username" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]+" autocomplete="username" required>
          <small>唯一，可用于登录；以后可以修改。首次用户名会作为稳定 Minecraft 游戏名。</small>
        </label>
        <label class="identity-field">
          <span>邮箱</span>
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label class="identity-field">
          <span>密码</span>
          <input name="password" type="password" minlength="10" autocomplete="new-password" required>
          <small>至少 10 位。</small>
        </label>
        <div class="identity-inline-help">
          已经有账户？<a href="/login" data-preserve-continue>登录</a>
        </div>
        <div class="identity-actions">
          <button type="submit" class="identity-primary">创建账户</button>
        </div>
      </form>

      <div class="identity-divider"><span>或使用第三方账户</span></div>
      <div class="identity-social">
        <a class="identity-social-button" data-provider="qq" href="#" aria-disabled="true">使用 QQ 注册</a>
        <a class="identity-social-button" data-provider="wechat" href="#" aria-disabled="true">使用微信注册</a>
      </div>
    </section>
  </main>

  <footer class="identity-footer">
    <span>muxi 账户</span>
    <span>统一身份服务</span>
  </footer>
  <script src="/static/app.js" defer></script>
</body>
</html>
