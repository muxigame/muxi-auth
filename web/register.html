<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>创建账户 · muxi 账户</title>
  <link rel="stylesheet" href="/static/theme.css?v=theme-20261115">
  <link rel="stylesheet" href="/static/style.css?v=theme-20261115">
  <link rel="stylesheet" href="/static/identity.css?v=identity-20261116">
</head>
<body class="identity-body">
  <main class="identity-stage">
    <section class="identity-card" aria-labelledby="page-title">
      <a class="identity-brand" href="/" aria-label="muxi 账户">
        <span class="identity-mark" aria-hidden="true">M</span>
        <span>muxi</span>
      </a>

      <p class="identity-context" id="auth-context" hidden></p>
      <h1 id="page-title">创建账户</h1>
      <p class="identity-subtitle">这个账户将用于 muxigame 的网站与客户端。</p>

      <div id="message" class="identity-message" hidden></div>

      <!-- 注册成功后顶掉整个表单。原先只是清空表单再弹一句"验证邮件已发送"，
           页面看上去和没提交过一模一样，用户以为失败了、反复重试。 -->
      <div id="register-done" class="identity-done" hidden>
        <div class="identity-done-mark" aria-hidden="true">✉</div>
        <h2>去邮箱收一封验证信</h2>
        <p>我们已经把验证链接发到 <b id="register-done-email">—</b>，24 小时内点开即可完成注册。</p>
        <p class="identity-done-hint">没收到？先翻一下垃圾邮件，或者换个地址重来。</p>
        <div class="identity-actions">
          <button type="button" class="identity-primary" id="register-resend">重新发送</button>
          <a class="identity-secondary" href="/login" data-preserve-continue>去登录</a>
        </div>
      </div>

      <form id="register-form" class="identity-form">
        <label class="identity-field">
          <span>昵称</span>
          <input name="nickname" maxlength="64" autocomplete="nickname" autofocus required>
          <small>用于平台展示，可以和其他人重复，也可以以后修改。</small>
        </label>
        <label class="identity-field">
          <span>用户名</span>
          <input name="username" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]+" autocomplete="username" required>
          <small>3–16 位字母、数字或下划线。唯一，可登录，可修改；不影响游戏身份。</small>
        </label>
        <label class="identity-field">
          <span>邮箱</span>
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label class="identity-field">
          <span>密码</span>
          <input name="password" type="password" minlength="10" autocomplete="new-password" required>
          <small>至少 10 位。</small>
        </label>
        <div class="identity-inline-help">
          已经有账户？<a href="/login" data-preserve-continue>登录</a>
        </div>
        <div class="identity-actions">
          <button type="submit" class="identity-primary">创建账户</button>
        </div>
      </form>

      <div class="identity-divider" data-social><span>或使用第三方账户</span></div>
      <div class="identity-social" data-social role="group" aria-label="或使用第三方账户">

        <a class="identity-social-button" data-provider="wechat" href="#" aria-disabled="true" aria-label="使用 微信 注册" title="微信"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg></a>
        <a class="identity-social-button" data-provider="microsoft" href="#" aria-disabled="true" aria-label="使用 Microsoft 注册" title="Microsoft"><svg viewBox="0 0 23 23" aria-hidden="true"><path fill="#f25022" d="M1 1h10v10H1z"/><path fill="#7fba00" d="M12 1h10v10H12z"/><path fill="#00a4ef" d="M1 12h10v10H1z"/><path fill="#ffb900" d="M12 12h10v10H12z"/></svg></a>
        <a class="identity-social-button" data-provider="google" href="#" aria-disabled="true" aria-label="使用 Google 注册" title="Google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></a>
      </div>
    </section>
  </main>

  <footer class="identity-footer">
    <span>muxi 账户</span>
    <span>统一身份服务</span>
  </footer>
  <script src="/static/app.js?v=identity-20261116" defer></script>
</body>
</html>
