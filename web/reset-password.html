<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>设置新密码 · muxi 账户</title>
  <link rel="stylesheet" href="/static/theme.css?v=theme-20261115">
  <link rel="stylesheet" href="/static/style.css?v=theme-20261115">
  <link rel="stylesheet" href="/static/identity.css?v=identity-20261116">
</head>
<body class="identity-body">
  <main class="identity-stage">
    <section class="identity-card" aria-labelledby="page-title">
      <a class="identity-brand" href="/" aria-label="muxi 账户">
        <span class="identity-mark" aria-hidden="true">M</span>
        <span>muxi</span>
      </a>

      <p class="identity-context" id="auth-context" hidden></p>
      <h1 id="page-title">设置新密码</h1>
      <p class="identity-subtitle">设置完成后，原账户登录状态将失效，需要重新登录。</p>
      <div id="message" class="identity-message" role="status" aria-live="polite" hidden></div>

      <form id="reset-password-form" class="identity-form" method="post" action="/api/account/password-reset/confirm" hidden>
        <label class="identity-field">
          <span>新密码</span>
          <input name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" autofocus required>
          <small>10–128 位。密码中的空格会保留。</small>
        </label>
        <label class="identity-field">
          <span>再次输入新密码</span>
          <input name="password_confirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
        </label>
        <div class="identity-actions">
          <button type="submit" class="identity-primary" disabled>保存新密码</button>
        </div>
      </form>

      <div id="reset-password-done" class="identity-done" hidden>
        <div class="identity-done-mark" aria-hidden="true">✓</div>
        <h2>密码已更新</h2>
        <p>密码已更新，原账户登录状态已失效，请重新登录。</p>
        <div class="identity-actions">
          <a class="identity-secondary" href="/login" data-preserve-continue>去登录</a>
        </div>
      </div>
      <div class="identity-inline-help">
        <a href="/forgot-password" data-preserve-continue>重新申请找回密码</a>
        <span aria-hidden="true"> · </span><a href="/login" data-preserve-continue>返回登录</a>
      </div>
      <noscript><p class="identity-subtitle">请启用 JavaScript，再重新打开邮件中的链接。</p></noscript>
    </section>
  </main>
  <footer class="identity-footer"><span>muxi 账户</span><span>统一身份服务</span></footer>
  <script src="/static/app.js?v=identity-20261116" defer></script>
</body>
</html>
