name: CI

on:
  push:
    branches: ["master", "dev"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit tests
        env:
          MUXI_ISSUER: http://127.0.0.1:9000
          MUXI_AUTH_DEV_VERIFY: "1"
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Import application
        env:
          MUXI_ISSUER: http://127.0.0.1:9000
          MUXI_AUTH_DEV_VERIFY: "1"
        run: python -c "from app.main import app; print(app.title)"
      - name: Build container
        run: docker build -t muxi-auth:ci .
