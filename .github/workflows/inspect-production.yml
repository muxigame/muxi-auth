name: Inspect production (read-only)

# Prints a redacted description of the running deployment so the repository can
# describe production exactly. It never writes, restarts, or removes anything
# outside its own temporary upload directory.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muxi-auth-production
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload inspector
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "scripts/inspect_production.py,scripts/inspect_bindings.py"
          target: "/tmp/muxi-auth-inspect"
          overwrite: true

      - name: Inspect
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            python3 /tmp/muxi-auth-inspect/scripts/inspect_production.py
            status=$?
            rm -rf /tmp/muxi-auth-inspect
            exit $status
