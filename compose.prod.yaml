services:
  muxi-auth:
    build: .
    image: muxi-auth:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

